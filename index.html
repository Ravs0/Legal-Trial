<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrialSim - Mock Trial Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-bg-primary': '#0D0D0D',      // Deep black (Base for neumorphism)
            'brand-bg-secondary': '#1A1A1A',    // Slightly lighter black for subtle contrast (was #131313)
            'brand-text-primary': '#E5E7EB',    // Tailwind gray-200 (Main light text)
            'brand-text-secondary': '#9CA3AF',   // Tailwind gray-400 (Subtle text)
            
            'brand-accent': '#a32214',           // Deep Red (NEW ACCENT)
            'brand-accent-hover': '#8a1c10',      // Darker Red (NEW ACCENT HOVER)
            'brand-accent-text': tailwind.colors.white, // White text for on red buttons
            
            'brand-gradient-from': '#a32214', // Deep Red (Start of gradient)
            'brand-gradient-mid': '#c02d1a',  // Brighter Red (Mid of gradient)
            'brand-gradient-to': '#6b120a',   // Darker Red (End ofgradient - or to neutral-900 for fade to black)

            'brand-border': 'rgba(50, 50, 50, 0.3)', 
            'brand-border-light': 'rgba(60, 60, 60, 0.4)', 
            
            'brand-error': '#EF4444',           // Tailwind red-500 (Kept for distinct error states)
            'brand-success': '#22C55E',         // Tailwind green-500 (Kept for success states)
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Georgia', 'serif'],
          },
          boxShadow: {
            // Neumorphic shadows using CSS variables for consistency with dark background
            'neumorphic-raised': '6px 6px 12px var(--neumorphic-shadow-dark-var), -6px -6px 12px var(--neumorphic-shadow-light-var)',
            'neumorphic-pressed': 'inset 6px 6px 12px var(--neumorphic-shadow-dark-var), inset -6px -6px 12px var(--neumorphic-shadow-light-var)',
            'neumorphic-flat': '3px 3px 6px var(--neumorphic-shadow-dark-var), -3px -3px 6px var(--neumorphic-shadow-light-var)',
            'neumorphic-highlight': '2px 2px 5px var(--neumorphic-shadow-dark-var), -2px -2px 5px var(--neumorphic-shadow-light-var), inset 1px 1px 2px var(--neumorphic-shadow-light-var), inset -1px -1px 2px var(--neumorphic-shadow-dark-var)',
          },
          keyframes: {
            typing: {
              '0%': { width: '0%' },
              '100%': { width: '100%' },
            },
            blink: {
              '50%': { borderColor: 'transparent' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideInUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            slideInLeft: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(0)' },
            },
            'staggered-fade-in-item': {
              '0%': { opacity: '0', transform: 'translateY(10px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          animation: {
            typing: 'typing 2s steps(40, end), blink .75s step-end infinite',
            fadeIn: 'fadeIn 0.5s ease-out',
            slideInUp: 'slideInUp 0.5s ease-out',
            slideInLeft: 'slideInLeft 0.3s ease-out forwards',
            'staggered-fade-in-item': 'staggered-fade-in-item 0.5s ease-out forwards',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Georgia&display=swap" rel="stylesheet">
  <style>
    html, body {
      overflow-x: hidden; /* Prevent horizontal scrollbars */
    }
    body {
      background-color: #0D0D0D; /* brand-bg-primary */
      color: #E5E7EB; /* brand-text-primary */
      font-family: 'Inter', sans-serif;
      /* CSS variables for neumorphic shadows based on #0D0D0D background */
      --neumorphic-shadow-light-var: rgba(35, 35, 35, 0.5); 
      --neumorphic-shadow-dark-var: rgba(0, 0, 0, 0.7);      
    }
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1A1A1A; /* brand-bg-secondary */
    }
    ::-webkit-scrollbar-thumb {
      background: #4B5563; /* gray-600 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a32214; /* brand-accent (Deep Red) */
    }
    /* Styling for optgroup labels within SelectInput */
    select option[value^="__optgroup__"] {
        font-weight: bold;
        color: #a32214; /* brand-accent (Deep Red) */
        background-color: #101010; /* Slightly darker than brand-bg-primary for differentiation */
        padding-top: 0.5rem;
        padding-bottom: 0.25rem;
        font-style: italic;
    }
    /* Styling for regular options */
    select option:not([value^="__optgroup__"]) {
      padding-left: 1rem; 
       background-color: #1A1A1A; /* brand-bg-secondary */
       color: #E5E7EB; /* brand-text-primary */
    }

    .animation-delay-200 { animation-delay: 0.2s; }
    .animation-delay-400 { animation-delay: 0.4s; }
    .animation-delay-600 { animation-delay: 0.6s; }

    /* For elements that need a neumorphic :active state specifically if Tailwind variants are tricky */
    .neumorphic-interactive {
      background-color: #0D0D0D; /* brand-bg-primary */
      box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow); /* Tailwind's shadow setup */
      transition: box-shadow 0.15s ease-in-out;
    }
    .neumorphic-interactive:active, .neumorphic-interactive-pressed {
      box-shadow: inset 6px 6px 12px var(--neumorphic-shadow-dark-var), inset -6px -6px 12px var(--neumorphic-shadow-light-var), var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000) !important;
    }
    /* Utility for a top shadow, e.g., for fixed footers over scrollable content */
    .shadow-top {
      box-shadow: 0 -4px 6px -1px var(--neumorphic-shadow-dark-var), 0 -2px 4px -1px var(--neumorphic-shadow-dark-var);
    }
    /* Custom scrollbar for specific elements if needed */
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent; /* Or a very dark gray like #101010 */
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #4b5563; /* gray-600 */
        border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #a32214; /* brand-accent */
    }

  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.0.1",
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/"
  }
}
</script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
